<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TRANSCORP ERP</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--b:#05569a;--bd:#033a6b;--bg:#f2f5f9;--t:#1b2733;--c:#fff;--l:#d5dde6}
@media(prefers-color-scheme:dark){:root{--bg:#10171f;--t:#e6edf3;--c:#18222d;--l:#2c3a49}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;display:flex;gap:14px;align-items:center;padding:10px 18px}
header img{height:56px;border-radius:4px}header h1{margin:0;font-size:22px;letter-spacing:2px}header small{display:block;opacity:.9;font-size:11px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--bd);padding:6px 12px}nav button{background:none;border:0;color:#fff;padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px}nav button.on,nav button:hover{background:var(--b)}
main{padding:16px;max-width:1200px;margin:auto}.card{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px;color:var(--b)}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--l);text-align:left}th{background:var(--b);color:#fff;font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{padding:7px;border:1px solid var(--l);border-radius:5px;background:var(--c);color:var(--t);font:inherit;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{font-size:12px;opacity:.8;display:block;margin-bottom:2px}
.btn{background:var(--b);color:#fff;border:0;padding:8px 16px;border-radius:5px;cursor:pointer;font:inherit}.btn.s{background:#6b7b8c}.btn.r{background:#b3261e}.btn.xs{padding:3px 8px;font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.k div{background:var(--c);border:1px solid var(--l);border-left:4px solid var(--b);border-radius:6px;padding:10px}.k b{display:block;font-size:19px;margin-top:3px}
.ok{color:#0a7a3a;font-weight:700}.bad{color:#b3261e;font-weight:700}.tot td{font-weight:700;border-top:2px solid var(--t)}
#pa{display:none}.agp{background:#fde4ea;color:#b3261e;font-weight:600}th.agh{background:#f4b6c4!important;color:#8a1428!important}#pa .agp,#pa .agh,.agp,.agh{-webkit-print-color-adjust:exact;print-color-adjust:exact}#pa th.agh{background:#f4b6c4;color:#8a1428}#pa .agp{background:#fde4ea;color:#b3261e}@media print{#toast{display:none!important}}@page{size:A4;margin:12mm 12mm 18mm 12mm}.pwp{display:none}.a4{padding-bottom:22mm}.ft{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;border-top:2px solid #05569a;padding-top:6px;color:#05569a;background:#fff}
@media print{.pwp{display:block!important;position:fixed;bottom:-11mm;left:0;right:0;text-align:center;font:10px Arial;color:#555;letter-spacing:.5px}header,nav,main,footer.pw{display:none!important}#pa{display:block!important;color:#000;background:#fff;font:13px Arial}body{background:#fff}}
.ph{display:flex;gap:12px;align-items:center;border-bottom:3px solid #05569a;padding-bottom:8px;margin-bottom:12px}.ph img{height:64px}.ph h1{margin:0;font-size:22px;color:#05569a}.ph small{display:block;font-size:11px}
.sig{display:flex;justify-content:space-between;margin-top:70px}.sig div{border-top:1px solid #000;width:22%;text-align:center;padding-top:4px;font-size:12px}
#pa table th{background:#05569a;color:#fff}#pa td,#pa th{border:1px solid #999}
.fw{display:flex;gap:3px;align-items:center}.fw>input,.fw>select,.fw>textarea{flex:1;min-width:0}.rs{background:none;border:1px solid var(--l);color:var(--t);border-radius:5px;cursor:pointer;padding:3px 7px;font-size:13px;line-height:1}.rs:hover{background:var(--b);color:#fff}.ss{position:relative;display:flex;gap:3px;align-items:center;min-width:170px}.ss>input{flex:1;min-width:0}.ssl{position:fixed;z-index:200;max-height:260px;overflow-y:auto;background:var(--c);border:1px solid var(--b);border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.25);min-width:260px}.ssl div{padding:6px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--l)}.ssl div.on,.ssl div:hover{background:var(--b);color:#fff}.ssl i{padding:6px 9px;display:block;font-size:12px;opacity:.7}footer.pw{text-align:center;padding:14px;font-size:12px;opacity:.75}

function newRecovery(){if(!confirm('Create a new Recovery Key? The old one stops working.'))return;const k=genKey(),ks=mksalt();S.rec={salt:ks,hash:hashPw(k,ks)};log('Recovery key regenerated');save();credBox('New Recovery Key',{name:'Administrator recovery',id:'-'},k)}
function pgTool(){const n=+document.getElementById('pg_n').value||12,c=Math.min(Math.max(+document.getElementById('pg_c').value||3,1),10),o=[];for(let i=0;i<c;i++)o.push(genPass(Math.min(Math.max(n,8),32)));document.getElementById('pg_o').innerHTML=o.map(p=>`<div style="font:700 17px monospace;padding:4px 0">${E(p)} <button class="btn s xs" onclick="navigator.clipboard&&navigator.clipboard.writeText('${E(p)}')">Copy</button></div>`).join('')}
V.Users=()=>`<div class="card"><h2>Add a User</h2><p style="font-size:12px">Create one login per person. Click Generate to give each person their own strong password (or leave the box empty and one is generated). Each person must choose their own password at the first sign-in.</p><div class="g"><div><label>Full name</label><input id="nu_n"></div><div><label>Login ID</label><input id="nu_i"></div><div><label>Role</label><select id="nu_r">${Object.keys(ROLES).map(r=>`<option value="${r}" ${r=='staff'?'selected':''}>${ROLES[r]}</option>`).join('')}</select></div><div><label>Password (blank = generate)</label><div style="display:flex;gap:6px"><input id="nu_p"><button class="btn s xs" onclick="document.getElementById('nu_p').value=genPass(12)">Generate</button></div></div></div><p><label style="display:inline"><input type="checkbox" id="nu_m" checked style="width:auto"> Must change password at first sign-in</label></p><p><button class="btn" onclick="uCreate()">Create user</button></p></div>
<div class="card"><h2>Users (${S.users.length})</h2><div style="overflow-x:auto"><table><tr><th>Login ID</th><th>Name</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${E(u.id)}</td><td><input value="${E(u.name)}" onchange="uName(${i},this.value)"></td><td><select onchange="uRole(${i},this.value)">${Object.keys(ROLES).map(r=>`<option value="${r}" ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${u.on===0?'<span class="bad">Disabled</span>':'<span class="ok">Active</span>'}${u.must?'<br><small>must change password</small>':''}</td><td>${E(u.last||'never')}</td><td><button class="btn xs" onclick="uReset(${i})">Reset password</button> <button class="btn xs s" onclick="uToggle(${i})">${u.on===0?'Enable':'Disable'}</button> <button class="btn xs r" onclick="uDel(${i})">Delete</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Security Settings</h2><div class="g"><div><label>Auto-lock after (minutes of inactivity, 0 = never)</label><input type="number" value="${S.lockMin==null?15:S.lockMin}" onchange="uLockMin(this.value)"></div></div><p><button class="btn s" onclick="newRecovery()">Generate a new Recovery Key</button></p><small>Five wrong passwords lock sign-in for one minute. All sign-ins, resets and changes are recorded in the audit trail (Backup tab).</small></div>
<div class="card"><h2>Password Generator</h2><div class="g"><div><label>Length (8-32)</label><input id="pg_n" type="number" value="12"></div><div><label>How many passwords</label><input id="pg_c" type="number" value="3"></div></div><p><button class="btn" onclick="pgTool()">Generate</button></p><div id="pg_o"></div></div>`;
function authInit(){S.users=S.users||[];const sid=sessionStorage.tc_sess,u=sid&&uById(sid);if(!S.users.length){LOCKED=true;setupScreen()}else if(u&&u.on!==0&&!u.must){CU=u;LOCKED=false;idleReset()}else{LOCKED=true;loginScreen()}}
authInit();

// ===== V11: one window at a time (notify and protect data)
const WID=Math.random().toString(36).slice(2);let BLK=false;
function blockWin(html){BLK=true;LOCKED=true;clearTimeout(idleT);let d=document.getElementById('blk');if(!d){d=document.createElement('div');d.id='blk';d.style.cssText='position:fixed;inset:0;z-index:100001;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px';document.body.appendChild(d)}d.innerHTML=`<div class="card" style="width:min(500px,100%)"><div style="text-align:center">${lgi('height:56px')}<h2>${E(S.biz.name)}</h2></div>${html}</div>`}
const _si11=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(BLK&&k=='tc_data')return;return _si11.apply(this,arguments)};
function startBlockedByOther(user){blockWin(`<h2 class="bad">Already open in another window</h2><p>${E(S.biz.name)} is already open in another window or tab on this computer${user?' (signed in as <b>'+E(user)+'</b>)':''}. Two windows working at once can overwrite each other's entries, so this window is blocked.</p><p>Please close this window and continue in the other one.</p><p><button class="btn" onclick="location.reload()">Check again</button> <button class="btn s" onclick="takeOver()">Use this window instead (locks the other one)</button></p>`)}
function takeOver(){localStorage.setItem('tc_takeover',WID+'|'+Date.now());setTimeout(()=>{BLK=false;localStorage.removeItem('tc_alive');location.reload()},600)}
function lockOld(why){try{const d=localStorage.getItem('tc_data');if(d)S=JSON.parse(d)}catch(e){}blockWin(`<h2 class="bad">${why||'This window was locked'}</h2><p>${why&&/changed/.test(why)?'Another window saved changes to the books. To avoid overwriting them, this window is locked.':'The application was opened in another window, so this one was locked to protect your data.'}</p><p><button class="btn" onclick="BLK=false;location.reload()">Reload this window</button></p>`)}
window.addEventListener('storage',e=>{if(BLK)return;if(e.key=='tc_takeover'&&e.newValue&&e.newValue.indexOf(WID)!=0)lockOld('Application opened in another window');else if(e.key=='tc_data'&&e.newValue)lockOld('Data was changed in another window')});
function beat(){if(!BLK)localStorage.setItem('tc_alive',JSON.stringify({id:WID,ts:Date.now(),user:CU?CU.name:''}))}
window.addEventListener('beforeunload',()=>{if(BLK)return;try{const a=JSON.parse(localStorage.getItem('tc_alive')||'null');if(a&&a.id==WID)localStorage.removeItem('tc_alive')}catch(e){}});
(function(){let a=null;try{a=JSON.parse(localStorage.getItem('tc_alive')||'null')}catch(e){}if(a&&a.id!=WID&&Date.now()-a.ts<6000){startBlockedByOther(a.user)}else{beat();setInterval(beat,2000)}})();

draw();
</script></body></html>
